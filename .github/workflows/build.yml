name: Build Syrup

on:
  push:
    branches: ['**']
    tags: ['v*']   # a v* tag builds a numbered release (v1.0-beta1 etc.)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Trust the checkout (git in the container)
        run: git config --global --add safe.directory '*'

      - name: Install CIA tools (bannertool, makerom)
        run: |
          apt-get update && apt-get install -y p7zip-full curl
          curl -L https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip -o bannertool.zip
          7z e -y bannertool.zip linux-x86_64/bannertool
          chmod +x bannertool && mv bannertool /usr/local/bin/
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o makerom.zip
          7z e -y makerom.zip
          chmod +x makerom && mv makerom /usr/local/bin/

      - name: Install portlibs (curl + mbedtls for Wi-Fi downloads)
        # already in the devkitarm image; only reach pkg.devkitpro.org (which sometimes refuses CI) when one is missing
        run: dkp-pacman -Q 3ds-curl 3ds-mbedtls 3ds-zlib || dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib

      - name: Build .3dsx
        run: make

      - name: Build .cia
        run: |
          bannertool makebanner -i app/banner.png -a app/BannerAudio.wav -o build/banner.bin
          bannertool makesmdh -s "Syrup" -l "Wavetable synth" -p "Syrup" -i app/icon.png -o build/icon.bin
          makerom -f cia -target t -o syrup.cia -elf syrup.elf -rsf app/syrup.rsf -banner build/banner.bin -icon build/icon.bin

      - name: Version stamp (read by the in-app updater)
        run: echo "$(git rev-list --count HEAD) $(echo $GITHUB_SHA | cut -c1-7)" > version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: syrup
          path: |
            syrup.3dsx
            syrup.cia
            syrup.elf

      - name: Publish numbered release (v* tags; "beta" / "rc" tags are pre-releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Syrup ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: false
          files: |
            syrup.3dsx
            syrup.cia
            install-qr.png

      - name: Publish to "latest" release (QR / phone download)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Syrup (latest build)
          make_latest: true
          files: |
            syrup.3dsx
            syrup.cia
            syrup.elf
            version.txt
