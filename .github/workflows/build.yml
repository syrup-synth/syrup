name: Build Syrup

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CIA tools (bannertool, makerom)
        run: |
          apt-get update && apt-get install -y p7zip-full curl
          curl -L https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip -o bannertool.zip
          7z e -y bannertool.zip linux-x86_64/bannertool
          chmod +x bannertool && mv bannertool /usr/local/bin/
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o makerom.zip
          7z e -y makerom.zip
          chmod +x makerom && mv makerom /usr/local/bin/

      - name: Install portlibs (curl + mbedtls for Wi-Fi downloads)
        run: dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib

      - name: Build .3dsx
        run: make

      - name: Build .cia
        run: |
          bannertool makebanner -i app/banner.png -a app/BannerAudio.wav -o build/banner.bin
          bannertool makesmdh -s "Syrup" -l "Wavetable synth" -p "Soul Provider Records" -i app/icon.png -o build/icon.bin
          makerom -f cia -target t -o syrup.cia -elf syrup.elf -rsf app/syrup.rsf -banner build/banner.bin -icon build/icon.bin

      - name: Version stamp (read by the in-app updater)
        run: echo "$GITHUB_SHA" | cut -c1-7 > version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: syrup
          path: |
            syrup.3dsx
            syrup.cia
            syrup.elf

      - name: Publish to "latest" release (QR / phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Syrup (latest build)
          make_latest: true
          files: |
            syrup.3dsx
            syrup.cia
            syrup.elf
            version.txt

  irmidi:
    # RP2040 IR MIDI adapter firmware (USB MIDI -> IrDA to the 2DS)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain + Pico SDK
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Build syrup_irmidi.uf2
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          cmake -S irmidi -B irmidi/build -DPICO_BOARD=pico
          make -C irmidi/build -j4
          cp irmidi/build/syrup_irmidi.uf2 .
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: syrup_irmidi.uf2
